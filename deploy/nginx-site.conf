# 独立虚拟主机示例；不要覆盖正在运行的私人站点。先配置自己的TLS证书。
server {
    listen 443 ssl;
    server_name coffee.example.com;
    ssl_certificate /etc/letsencrypt/live/coffee.example.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/coffee.example.com/privkey.pem;

    location = /api/luckin/mcp { include /etc/nginx/snippets/xiaokui-luckin.conf; }
    location = /api/luckin/preview/mcp { include /etc/nginx/snippets/xiaokui-luckin.conf; }
    location = /api/luckin/orders/mcp { include /etc/nginx/snippets/xiaokui-luckin.conf; }
    location = /.well-known/oauth-authorization-server { include /etc/nginx/snippets/xiaokui-luckin.conf; }
    location = /.well-known/oauth-protected-resource { include /etc/nginx/snippets/xiaokui-luckin.conf; }
    location = /.well-known/oauth-protected-resource/api/luckin/mcp { include /etc/nginx/snippets/xiaokui-luckin.conf; }
    location = /.well-known/oauth-protected-resource/api/luckin/preview/mcp { include /etc/nginx/snippets/xiaokui-luckin.conf; }
    location = /.well-known/oauth-protected-resource/api/luckin/orders/mcp { include /etc/nginx/snippets/xiaokui-luckin.conf; }
    location ^~ /oauth/ { include /etc/nginx/snippets/xiaokui-luckin.conf; }
    location ^~ /auth/ { include /etc/nginx/snippets/xiaokui-luckin.conf; }
    location ^~ /api/luckin/orders/confirm/ { include /etc/nginx/snippets/xiaokui-luckin.conf; }
    location / { return 404; }
}
